server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 256M;

    # Marker proving CI/CD auto-deploy is live (safe to remove).
    add_header X-Code9-Deploy "github-actions" always;

    # Logs to stdout/stderr (captured by `docker compose logs`)
    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP to the php-fpm container
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
        fastcgi_read_timeout 600;
    }

    # Long-cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Harden: block hidden files and sensitive WordPress files
    location ~ /\.(?!well-known) { deny all; }
    location = /wp-config.php { deny all; }
    location ~* /(?:wp-content/uploads/.*\.(?:php|phtml))$ { deny all; }
}
