# Code9 Group — host nginx reverse proxy to the Dockerized WordPress stack.
# Serves the local site on port 80 under the real domain name, without
# disturbing the other vhosts (erp.metaxperts.net, fastapi, flask, mediamtx).
server {
    listen 80;
    listen [::]:80;
    server_name code9group.org www.code9group.org;

    access_log /var/log/nginx/code9group.access.log;
    error_log  /var/log/nginx/code9group.error.log;

    client_max_body_size 256M;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 600;
    }
}
